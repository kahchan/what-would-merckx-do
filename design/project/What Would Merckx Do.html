<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>What Would Merckx Do?</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=Space+Mono:wght@400;700&family=Space+Grotesk:wght@300;400;500;600&family=Oswald:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body { background: #0c0c0c; transition: background 0.3s; }
    #root { min-height: 100%; }
  </style>

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel" src="tweaks-panel.jsx"></script>
  <script type="text/babel" src="wwmd-components.jsx"></script>

  <script type="text/babel">
    // ─── Tweak defaults ────────────────────────────────────────────────────────
    const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
      "direction": "cannibale",
      "darkMode": true,
      "theme": "7eleven"
    }/*EDITMODE-END*/;

    // ─── Pick a random theme on first load for demo energy ─────────────────────
    const sessionTheme = (() => {
      const stored = localStorage.getItem('wwmd-theme');
      if (stored && window.THEMES?.[stored]) return stored;
      const keys = window.THEME_KEYS || ['motorola','look','7eleven','molteni'];
      return keys[Math.floor(Math.random() * keys.length)];
    })();

    // ─── Main ──────────────────────────────────────────────────────────────────
    function Main() {
      const [tweaks, setTweak] = useTweaks({ ...TWEAK_DEFAULTS, theme: sessionTheme });

      return (
        <React.Fragment>
          <WWMDApp
            dir={tweaks.direction}
            darkMode={tweaks.darkMode}
            theme={tweaks.theme}
            onThemeChange={v => setTweak('theme', v)}
          />

          <TweaksPanel>
            <TweakSection title="Style direction">
              <TweakSelect
                id="direction"
                label="Direction"
                value={tweaks.direction}
                onChange={v => setTweak('direction', v)}
                options={[
                  { value: 'cannibale',  label: 'Il Cannibale — dark editorial' },
                  { value: 'criterium',  label: 'Criterium — mono technical'    },
                  { value: 'domestique', label: 'Domestique — warm paper'       },
                ]}
              />
              <TweakToggle
                id="darkMode"
                label="Dark mode"
                value={tweaks.darkMode}
                onChange={v => setTweak('darkMode', v)}
              />
            </TweakSection>

            <TweakSection title="Team palette">
              <TweakSelect
                id="theme"
                label="Team"
                value={tweaks.theme}
                onChange={v => setTweak('theme', v)}
                options={[
                  { value: 'motorola',  label: 'Motorola — Red / Blue'      },
                  { value: 'look',      label: 'Look — Yellow / Red'         },
                  { value: '7eleven',   label: '7-Eleven — Red / Green'      },
                  { value: 'molteni',   label: 'Molteni — Orange / Blue'     },
                ]}
              />
            </TweakSection>
          </TweaksPanel>
        </React.Fragment>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<Main />);
  </script>
</body>
</html>
